<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
</head>
<body>
<template id="student-sidebar-template">
  <aside class="sd-sidebar" id="sdSidebar">

        <i data-lucide="graduation-cap"></i>

      <span class="sd-brand-accent">EduSaaS</span>
    </a>

    <p class="sd-nav-caption">STUDENT SPACE</p>

    <nav class="sd-side-nav" aria-label="Student navigation">
      <a class="sd-side-link" data-layout-active="dashboard-home" href="StudentDashboard.html">
        <i data-lucide="house"></i>
        <span>Home</span>
      </a>
      <a class="sd-side-link" href="student-courses.html">
        <i data-lucide="book-open"></i>
        <span>Courses</span>

        <span>AI Assistant</span>
      </a>
      <a class="sd-side-link" data-layout-active="dashboard-progress" href="StudentDashboard.html#progress">
        <i data-lucide="chart-no-axes-column-increasing"></i>

      <a class="sd-side-link" href="student-assessment.html">

        <span class="sd-nav-badge" id="sdNavUnread">2</span>

    <div class="sd-sidebar-footer">
      <button class="sd-side-link sd-logout" id="sdLogoutBtn" type="button">
        <i data-lucide="log-out"></i>
        <span>Log Out</span>
      </button>
      <div class="sd-side-user">
        <span class="sd-avatar" data-sd-avatar>ST</span>
        <div>
          <strong data-sd-name>Student</strong>
          <small>Student account</small>
        </div>
      </div>
