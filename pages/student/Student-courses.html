<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses | EduSaaS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../styles/tokens.css">

    <link rel="stylesheet" href="../../public/css/components.css">

    <link rel="stylesheet" href="../../public/css/style.css">

    <link rel="stylesheet" href="../../public/css/responsive.css">
</head>

<body class="student-dashboard student-courses-page">

    <div class="sd-app">

        <!-- SIDEBAR -->

        <div data-layout="sidebar" data-layout-variant="student-courses">
        </div>

        <div class="sd-page">

            <!-- NAVBAR -->

            <div data-layout="navbar" data-layout-variant="student-dashboard">
            </div>

            <main class="sd-main">

                <!-- PAGE INTRO -->

                <section class="sd-intro sc-intro">

                    <div>
                        <p class="sd-eyebrow">
                            YOUR LEARNING SPACE
                        </p>

                        <h1>My Courses</h1>

                        <p>
                            Manage your courses and continue
                            your learning journey.
                        </p>
                    </div>

                    <a href="Browse-public-courses.html" class="sc-browse-btn">

                        <i data-lucide="compass"></i>

                        Browse Public Courses

                        <i data-lucide="arrow-up-right"></i>

                    </a>

                </section>

                <!-- COURSE STATISTICS -->

                <section class="sd-stats-grid sc-stats" aria-label="Course summary">

                    <article class="sd-stat-card">

                        <span class="sd-stat-icon sd-mint">
                            <i data-lucide="book-open"></i>
                        </span>

                        <div>
                            <strong id="scEnrolledCount">0</strong>
                            <small>Enrolled Courses</small>
                        </div>

                    </article>

                    <article class="sd-stat-card">

                        <span class="sd-stat-icon sd-blue">
                            <i data-lucide="chart-no-axes-column-increasing"></i>
                        </span>

                        <div>
                            <strong id="scInProgressCount">0</strong>
                            <small>In Progress</small>
                        </div>

                    </article>

                    <article class="sd-stat-card">

                        <span class="sd-stat-icon sd-rose">
                            <i data-lucide="circle-check"></i>
                        </span>

                        <div>
                            <strong id="scCompletedCount">0</strong>
                            <small>Completed</small>
                        </div>

                    </article>

                </section>

                <!-- SEARCH AND FILTERS -->

                <section class="sc-toolbar" aria-label="Filter courses">

                    <div class="sc-search">

                        <i data-lucide="search"></i>

                        <input type="search" id="scSearch" placeholder="Search your courses..."
                            aria-label="Search your courses">

                    </div>

                    <select id="scStatusFilter" aria-label="Filter by course status">

                        <option value="all">
                            All Courses
                        </option>

                        <option value="not-started">
                            Not Started
                        </option>

                        <option value="in-progress">
                            In Progress
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </section>

                <!-- ENROLLED COURSES -->

                <section class="sd-section">

                    <div class="sd-section-heading">

                        <div>

                            <p class="sd-eyebrow">
                                KEEP LEARNING
                            </p>

                            <h2>Enrolled Courses</h2>

                            <p>
                                Pick up where you left off.
                            </p>

                        </div>

                        <span class="sd-count-chip" id="sdCourseCount">
                            0 courses
                        </span>

                    </div>

                    <div class="sd-course-grid" id="sdCourseGrid">
                    </div>
                    <!-- LOAD MORE COURSES -->

                    <div class="sc-load-more" id="scLoadMoreWrapper" hidden>

                        <p class="sc-showing-count" id="scShowingCount"></p>

                        <button type="button" class="sc-load-more-btn" id="scLoadMore">

                            Load More

                            <i data-lucide="chevron-down"></i>

                        </button>

                    </div>

                    <!-- EMPTY STATE -->

                    <div class="sc-empty" id="sdSearchEmpty" hidden>

                        <span class="sc-empty-icon">
                            <i data-lucide="book-open"></i>
                        </span>

                        <h3>No courses found</h3>

                        <p>
                            Try changing your search or filters.
                        </p>

                        <button type="button" id="scResetFilters" class="sc-reset-btn">

                            Clear Filters

                        </button>

                    </div>

                </section>

                <!-- FOOTER -->

                <div data-layout="footer" data-layout-variant="student">
                </div>

            </main>

        </div>

    </div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>

    <script src="../../public/js/layout.js" defer></script>

    <script src="../../public/js/main.js" defer></script>

</body>

</html>
